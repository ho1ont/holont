name: Patch Contact3 settled long press

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-fix-contact3-longpress.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch settled-message long press
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('qa-runner/tests/contact3.spec.mjs')
          s=p.read_text()
          old1="await page.locator('.pc47-send,.pc46-send').click();await expect(page.locator('.pc47-msg').filter({hasText:'QA3 LIVE SEND'}).last()).toBeVisible({timeout:10000});sendLatency=Date.now()-tSend;"
          new1="await page.locator('.pc47-send,.pc46-send').click();const settledLive=page.locator('.pc47-msg[data-pc47-msg]').filter({hasText:'QA3 LIVE SEND'}).last();await expect(settledLive).toBeVisible({timeout:10000});sendLatency=Date.now()-tSend;"
          old2="let live=page.locator('.pc47-msg').filter({hasText:'QA3 LIVE SEND'}).last();await hold(page,live);"
          new2="let live=settledLive;await hold(page,live);"
          if old1 not in s: raise SystemExit('send marker not found')
          if old2 not in s: raise SystemExit('longpress marker not found')
          p.write_text(s.replace(old1,new1,1).replace(old2,new2,1))
          PY
      - name: Commit
        run: |
          git config user.name 'PRIME QA Bot'
          git config user.email 'qa-bot@prime.invalid'
          git add qa-runner/tests/contact3.spec.mjs
          git commit -m 'qa: long-press only settled Contact messages'
          git push
