name: PRIME Calls Deep QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'qa-runner/tests/calls.spec.mjs'
      - '.github/workflows/prime-calls-deep-qa.yml'

permissions:
  contents: read

concurrency:
  group: prime-calls-deep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calls:
    strategy:
      fail-fast: false
      matrix:
        project: [iphone-15-pro, compact-iphone]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PRIME_URL: https://prime-online-v01.vercel.app/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: qa-runner
      - run: npx playwright install ffmpeg
        working-directory: qa-runner
      - name: Run PRIME Calls Deep QA
        run: npx playwright test tests/calls.spec.mjs --project='${{ matrix.project }}'
        working-directory: qa-runner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prime-calls-${{ matrix.project }}-${{ github.run_id }}
          path: qa-runner/artifacts
          if-no-files-found: warn
          retention-days: 3
