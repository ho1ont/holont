name: PRIME Contact R13.2 Verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'qa-runner/tests/contact3.spec.mjs'
      - 'qa-runner/playwright.config.mjs'
      - '.github/workflows/prime-contact-r132-verify.yml'

concurrency:
  group: prime-contact-r132-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        project: [iphone-15-pro, compact-iphone]
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      PRIME_URL: https://prime-online-v01.vercel.app/
      QA_VERIFY_REV: r132-v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: qa-runner
      - run: npx playwright install ffmpeg
        working-directory: qa-runner
      - name: Verify PRIME Contact R13.2
        run: npx playwright test tests/contact3.spec.mjs --project='${{ matrix.project }}'
        working-directory: qa-runner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prime-contact-r132-${{ matrix.project }}-${{ github.run_id }}
          path: qa-runner/artifacts
          if-no-files-found: warn
          retention-days: 3
